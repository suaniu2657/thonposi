<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thonposi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      width: 100%;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>thonposi</h2>

  <form id="privateForm">
    <textarea id="userInput" placeholder="輸入文字" required></textarea>
    <button type="submit" id="btn">送出</button>
  </form>

  <p id="msg"></p>

  <script>

    const gasApiUrl = 'https://script.google.com/macros/s/AKfycbztZyDPJsuczs3r7KEyBaim_sEIdqxQWKf42_blbZP4f4XbiAZPaXL94cV6IPV7QpTd2A/exec';

    const form = document.getElementById('privateForm');
    const userInput = document.getElementById('userInput');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      btn.disabled = true;
      btn.innerText = '傳送中';
      msg.innerText = '';

      fetch(gasApiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          message: userInput.value
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          msg.style.color = 'green';
          msg.innerText = '送出成功';
          form.reset();
        } else {
          msg.style.color = 'red';
          msg.innerText = '送出失敗：' + (data.message || '');
        }
      })
      .catch(error => {
        msg.style.color = 'red';
        msg.innerText = '連線失敗';
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = '送出';
      });
    });
  </script>

</body>
</html>
